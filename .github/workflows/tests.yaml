name: CI

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 24
  NPM_VERSION: 11.11.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build:shared

      - name: Run React tests
        run: npm --prefix react run tests

      - name: Run Node tests
        run: npm --prefix node run tests